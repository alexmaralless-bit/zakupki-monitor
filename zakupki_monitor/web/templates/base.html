<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Реестр{% endblock %} · Монитор госзакупок</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="dot"></span>Монитор госзакупок</a>
  <nav>
    <a href="/" class="{{ 'on' if path == '/' or path.startswith('/tenders') }}">Реестр</a>
    <a href="/profiles" class="{{ 'on' if path.startswith('/profiles') }}">Профили</a>
    <a href="/runs" class="{{ 'on' if path.startswith('/runs') }}">Журнал прогонов</a>
    <a href="/settings" class="{{ 'on' if path.startswith('/settings') }}">Настройки</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="foot">
  Монитор госзакупок {{ version }} · данные zakupki.gov.ru · только локальный доступ (127.0.0.1)
  {% if demo %}<span class="demo-badge">Демо-режим: вердикты ИИ сформированы заглушкой, не языковой моделью</span>{% endif %}
</footer>
</body>
</html>
