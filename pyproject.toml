[project]
name = "zakupki-monitor"
version = "0.2.0"
description = "Монитор госзакупок: сбор выдачи zakupki.gov.ru, разбор, рейтинг по правилам"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "fastapi>=0.142.2",
    "jinja2>=3.1",
    "apscheduler>=3.10,<4",
    "openpyxl>=3.1.5",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
zakupki-monitor = "zakupki_monitor.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zakupki_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient:DeprecationWarning"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["apscheduler.*", "openpyxl.*"]
ignore_missing_imports = true
